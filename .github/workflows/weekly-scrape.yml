name: Weekly IT Jobs Scraper

on:
  # Run every week on Sunday at 19:15 UTC = 01:00 NPT (Nepal Time, UTC+5:45)
  schedule:
    - cron: "15 19 * * 0"

  # Allow manual triggering from the GitHub Actions tab — no inputs needed,
  # always runs the full scrape (all portals + github companies crawler)
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape IT Jobs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: core

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Need full history so we can push the updated DB back
          fetch-depth: 1

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: core/requirements.txt

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Create .env file ───────────────────────────────────────────────────
      - name: Create .env file
        run: |
          cat > .env <<EOF
          DATABASE_URL=sqlite+aiosqlite:///./it_jobs_nepal.db
          SYNC_DATABASE_URL=sqlite:///./it_jobs_nepal.db
          CACHE_DB_URL=sqlite+aiosqlite:///./cache.db
          EOF
          # Note: AIRTABLE_API_KEY is not required — the company list is fetched
          # from the public GitHub README (mesaugat/tech-companies-in-nepal), not Airtable.

      # ── 4.1 Ensure database file exists ───────────────────────────────────────
      - name: Check if database exists, create if missing
        run: |
          if [ -f "it_jobs_nepal.db" ]; then
            echo "Database already exists — $(du -h it_jobs_nepal.db | cut -f1)"
          else
            echo "Database not found — creating a new one."
            python -c "import sqlite3; sqlite3.connect('it_jobs_nepal.db').close()"
            echo "Empty database created at core/it_jobs_nepal.db"
          fi

      # ── 5. Apply DB migrations ────────────────────────────────────────────────
      - name: Apply Alembic migrations
        run: alembic upgrade head

      # ── 5.1 Seed categories ───────────────────────────────────────────────────
      - name: Seed categories
        run: python seed_categories.py

      # ── 6. Run scrapers (always all portals + github companies crawler) ──────
      - name: Run portal scrapers
        run: python -m app.scrapers.run --source all --github-companies

      # ── 7. Commit updated database back to repo ───────────────────────────────
      - name: Commit updated database
        working-directory: .
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the database file (use -f to bypass .gitignore)
          git add -f core/it_jobs_nepal.db

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to the database — nothing to commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(db): weekly scrape — ${TIMESTAMP} [skip ci]"
            git push
            echo "Database committed and pushed."
          fi